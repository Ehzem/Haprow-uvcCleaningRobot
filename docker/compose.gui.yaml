services:
  workspace:
    environment:
      DISPLAY: ${DISPLAY:?Run from a desktop terminal with DISPLAY set}
      QT_X11_NO_MITSHM: "1"
      # Software rendering works without GPU device access; may be slower.
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
